name: Ecosystem web drift
# The weekly mechanical pass over the ecosystem web (https://github.com/haxtheweb/issues/issues/3296):
# ecosystem/build/run.sh fetches the latest source and reruns every generator, and what changed is reported in
# the run's summary, so new CLI commands, endpoints, MCP tools, workflows and rules show up for a person to assess.
#
# Report only. The job holds a read-only token and writes nothing to the repository: no branch, no pull request,
# no comment, no deployment. The changed files and the report are kept for a week as the ecosystem-drift artifact
# (ecosystem/build/drift_report.py).
on:
  schedule:
    - cron: "41 8 * * 0" # Sundays, 08:41 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-drift
  cancel-in-progress: false
jobs:
  regenerate:
    name: Rerun the generators
    # forks don't run it, and it only ever reports on main (a scheduled run is always on the default branch)
    if: github.repository == 'haxtheweb/praw' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch sources, rerun every generator, report drift
        env:
          GH_TOKEN: ${{ github.token }} # read-only here: the generators read public haxtheweb repos through gh
        run: ecosystem/build/run.sh
      - name: Report what changed
        run: python3 -I ecosystem/build/drift_report.py "$RUNNER_TEMP/drift"
      - name: Keep the report and the changed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecosystem-drift
          path: ${{ runner.temp }}/drift
          retention-days: 7
          if-no-files-found: error
