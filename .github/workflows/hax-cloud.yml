name: hax.cloud
# Checks that hax.cloud still builds (https://github.com/haxtheweb/issues/issues/3310). Vercel builds and serves
# the site (vercel.json at the repo root runs the same script); this workflow only builds it on pull requests
# that touch ecosystem/, so a broken build shows here before it reaches Vercel. Nothing here writes or deploys.
# It then runs an axe-core accessibility scan (WCAG 2.0 and 2.1 A and AA) of the built site's top two outline
# levels (--max-indent 1, about 200 pages; the ~1,650 below them are generated story pages on one template).
# .github/a11y/baseline.json records the violations present when the scan was added; the job fails only when
# a page gets a new kind of violation or more failing elements than the baseline (fixing things never fails
# it). After a fix, or when a maintainer accepts a finding, refresh it with the same command plus
# --update-baseline and commit the file.
#
# The site is a static HAXsite: the HAXcms site boilerplate from haxcms-nodejs main, with site.json, pages/
# and the interactive web (ecosystem.html) written by ecosystem/build/build_site.py, and build/: HAX's
# front-end build compiled from webcomponents master (ecosystem/build/compile-webcomponents.sh), so the site
# loads every element from itself.
on:
  pull_request:
    paths: ["ecosystem/**", "vercel.json", ".github/workflows/hax-cloud.yml", ".github/a11y/**"]
  schedule:
    # weekly: the site builds against webcomponents master, so element changes reach it without a PR here
    - cron: "29 6 * * 1" # weekly, Monday 06:29 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hax-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 50 # the build, then a browser pass over every page
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the site
        # the same script Vercel runs (vercel.json)
        run: ecosystem/build/site.sh
      - name: Check the site
        run: |
          python3 -I -c "import json; d = json.load(open('_site/site.json')); s = [i['slug'] for i in d['items']]; assert len(s) == len(set(s)), 'duplicate slugs'; e = sum(1 for i in d['items'] if 'ecosystem' in i['metadata']); assert e, 'no page says what it shows'; print(len(s), 'pages,', e, 'in a web; theme', d['metadata']['theme']['element'])"
          test -f _site/ecosystem.html && test -f _site/index.html && test -f _site/ecosystem-webs.json
          test -f _site/wc-registry.json && test -f _site/build/es6/node_modules/@haxtheweb/ecosystem-theme/ecosystem-theme.js
      - name: Check recent activity
        # the snapshot step's own cases (no network), then that the build published the snapshot and the page
        run: |
          python3 -I ecosystem/test/recent-check.py
          test -f _site/recent.json && test -f _site/recent/index.html
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the accessibility scanner
        run: |
          npm ci --prefix .github/a11y --ignore-scripts --no-audit --no-fund
          cd .github/a11y && npx playwright install --with-deps chromium
      - name: Accessibility (axe-core, WCAG 2.0/2.1 A and AA)
        # Report only: findings go to the job summary and never fail the build. The scan covers the home
        # page, each web's page and the pages one level under it (--max-indent 1, about 210 pages, the set
        # the baseline was recorded on). The whole site is over 1,800 pages, which does not fit in this job.
        continue-on-error: true
        timeout-minutes: 25
        run: node .github/a11y/a11y-scan.mjs --root _site --site-json _site/site.json --max-indent 1 --baseline .github/a11y/baseline.json
