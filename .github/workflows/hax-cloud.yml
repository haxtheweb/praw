name: hax.cloud
# Builds hax.cloud from the ecosystem web in ecosystem/ and publishes it to GitHub Pages
# (https://github.com/haxtheweb/issues/issues/3310). A pull request that touches ecosystem/ builds the
# site as a check; a push to main builds and deploys it. Nothing here writes to the repo.
#
# The site is a static HAXsite: the HAXcms site boilerplate from haxcms-nodejs main, with site.json, pages/
# and the interactive web (ecosystem.html) written by ecosystem/build/build_site.py. Elements load from the
# HAX CDN, as on any HAX site published to GitHub Pages.
#
# Before the first deploy, in this repo's settings: Pages > Source "GitHub Actions", custom domain hax.cloud.
on:
  push:
    branches: [main]
    paths: ["ecosystem/**", ".github/workflows/hax-cloud.yml"]
  pull_request:
    paths: ["ecosystem/**", ".github/workflows/hax-cloud.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hax-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the interactive web
        run: ecosystem/build/run.sh --assemble
      - name: Fetch the HAXcms site boilerplate
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/haxtheweb/haxcms-nodejs "$RUNNER_TEMP/hn"
          git -C "$RUNNER_TEMP/hn" sparse-checkout set src/boilerplate/site
      - name: Pick the theme
        # ecosystem-theme (webcomponents) once a release has put it on npm and the CDN; clean-one until then
        run: |
          if npm view @haxtheweb/ecosystem-theme version >/dev/null 2>&1; then
            echo "HAX_CLOUD_THEME=ecosystem-theme" >> "$GITHUB_ENV"
            echo "Building with ecosystem-theme"
          else
            echo "ecosystem-theme is not on npm yet: building with clean-one"
          fi
      - name: Build the site
        run: |
          rm -rf _site && mkdir _site
          cp -r "$RUNNER_TEMP/hn/src/boilerplate/site/." _site/
          # server-only files and the boilerplate's own content go; the static entry point comes in
          rm -rf _site/pages _site/site.json _site/.github _site/docker _site/Dockerfile _site/index.php _site/config.php _site/.htaccess _site/llms.txt
          cp _site/ghpages.html _site/index.html
          echo "hax.cloud" > _site/CNAME
          cd ecosystem/.work && python3 -I ../build/build_site.py ../../_site hax-area-icons.html
      - name: Check the site
        run: |
          python3 -I -c "import json; d = json.load(open('_site/site.json')); s = [i['slug'] for i in d['items']]; assert len(s) == len(set(s)), 'duplicate slugs'; e = sum(1 for i in d['items'] if 'ecosystem' in i['metadata']); assert e, 'no page says what it shows'; print(len(s), 'pages,', e, 'in a web; theme', d['metadata']['theme']['element'])"
          test -f _site/ecosystem.html && test -f _site/index.html && test -f _site/ecosystem-webs.json
      - name: Archive the site
        if: github.event_name != 'pull_request'
        run: tar --dereference -cf "$RUNNER_TEMP/artifact.tar" -C _site .
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
