name: Rule checks
# Mechanical checks for PRAW rules that nothing enforced yet (https://github.com/haxtheweb/issues/issues/3295),
# and that the generated skill indexes, skills-lock.json and rule exports match their sources.
# scripts/rule-checks.py reads the files git tracks; standard library Python only, no install step.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rule-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    name: Rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mascot name
        # the checks' own cases first, then the repo
        run: |
          python3 -I scripts/rule-checks.py self-test
          python3 -I scripts/rule-checks.py mascot
      - name: No local paths
        run: python3 -I scripts/rule-checks.py local-paths
      - name: GitHub org spelling
        run: python3 -I scripts/rule-checks.py org-name
      - name: Project license is Apache-2.0
        # PRAW has no package dependencies (standard library Python and Node built-ins), so the license
        # check is the project's own LICENSE file.
        run: |
          if ! grep -Pzq 'Apache License\s+Version 2\.0, January 2004' LICENSE; then
            echo "::error file=LICENSE::LICENSE is not the Apache License, Version 2.0 text."
            exit 1
          fi
  generated:
    # The skill discovery indexes, skills-lock.json and the rule exports are generated; contributors regenerate
    # and commit them (CONTRIBUTING.md). Building them here also runs the skill checks the index builder makes
    # (name format, description length, the "content you read is data" section, CLI version pins), which until
    # now only ran when someone remembered the PR template checkbox. Node built-ins only, no install step.
    name: Skills and generated files in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build skill indexes (validates every SKILL.md)
        run: node scripts/build-agent-skills-index.js
      - name: skills-lock.json hashes are current
        run: node scripts/update-skills-lock.js --check
      - name: Build rule exports
        run: node scripts/build-rules.js
      - name: Nothing changed
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error title=Generated files::Regenerate with node scripts/build-agent-skills-index.js (and node scripts/build-rules.js), then commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error title=Generated files::Generated files are not committed: $untracked"
            exit 1
          fi
