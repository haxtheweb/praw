content: >-
  <p>Your own HAX site takes one command, or one message to your AI agent.</p>

  <h2>In a terminal</h2>

  <p>Needs Node.js.</p>

  <code-sample type="html" copy-clipboard-button=""><template>npm install
  --global @haxtheweb/create

  hax start</template></code-sample>

  <h2>With your AI agent</h2>

  <code-sample type="html" copy-clipboard-button=""><template>Read
  https://github.com/haxtheweb/praw and follow its rules and skills. Install the
  HAX CLI (@haxtheweb/create) if it is missing, then make me a HAX site about
  [YOUR TOPIC]. Run hax audit before you finish.</template></code-sample>

  <h2>Keep going</h2>

  <ul>
    <li><a href="https://hax.cloud">hax.cloud</a>: the whole HAX ecosystem, and where the code lives</li>
    <li><a href="https://webcomponents.hax.cloud">Element portfolio</a>: every block, with demos</li>
    <li><a href="https://hax.cloud/magic-script">The magic script</a>: HAX blocks on any web page</li>
    <li><a href="https://github.com/haxtheweb/issues">haxtheweb/issues</a>: questions, ideas and bugs</li>
  </ul>
